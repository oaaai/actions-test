name: kvm-probe

on:
  push:
    branches: [ci/kvm-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Runner info
        run: |
          uname -a
          lsb_release -a || true
          nproc
          free -h
          df -h /
          systemd-detect-virt || true
          ls -l /dev/kvm || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Install qemu and check kvm-ok
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker qemu-system-x86
          sudo kvm-ok || true
          qemu-system-x86_64 --version

      - name: Boot a trivial VM
        run: |
          set -x
          qemu-system-x86_64 -accel kvm -machine q35 -m 256 -nographic -nodefaults -S &
          pid=$!
          sleep 3
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "KVM OK"
          else
            wait "$pid"
            echo "KVM NG"
            exit 1
          fi