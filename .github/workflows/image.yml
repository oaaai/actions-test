name: eksa-os

on:
  push:
    branches: [ci/image-build]
    paths:
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      bundle:
        description: EKS-A bundle number (131 = v0.27.0 / image-builder v0.7.0)
        default: "131"
      channel:
        description: EKS-D channel
        default: "1-36"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BUNDLE: ${{ github.event.inputs.bundle || '131' }}
      CHANNEL: ${{ github.event.inputs.channel || '1-36' }}
      PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          sudo usermod -aG kvm "$USER" || true
          ls -l /dev/kvm
          df -h /

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            jq make unzip curl wget git gettext sshpass openssh-client \
            qemu-kvm qemu-utils cpu-checker ovmf genisoimage \
            cloud-image-utils python3-venv python3-pip rsync
          if ! timeout 90 sudo snap install yq; then
            curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /tmp/yq
            sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          fi
          mkdir -p ~/.ssh
          echo 'HostKeyAlgorithms +ssh-rsa' >> ~/.ssh/config
          echo 'PubkeyAcceptedKeyTypes +ssh-rsa' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          sudo kvm-ok
          yq --version

      - name: Install ansible-core 2.15.13
        run: |
          python3 -m venv "$HOME/ansible-venv"
          "$HOME/ansible-venv/bin/pip" install --disable-pip-version-check ansible-core==2.15.13
          echo "$HOME/ansible-venv/bin" >> "$GITHUB_PATH"
          "$HOME/ansible-venv/bin/ansible" --version | head -3

      - name: Install image-builder
        env:
          IMAGE_BUILDER_URL: https://anywhere-assets.eks.amazonaws.com/releases/bundles/${{ env.BUNDLE }}/artifacts/image-builder/v0.7.0/image-builder-linux-amd64.tar.gz
        run: |
          curl -fsSL "$IMAGE_BUILDER_URL" -o /tmp/image-builder.tar.gz
          mkdir -p /tmp/image-builder
          tar xzf /tmp/image-builder.tar.gz -C /tmp/image-builder
          sudo install -m 0755 /tmp/image-builder/image-builder /usr/local/bin/image-builder
          image-builder version

      - name: Build node image
        run: |
          image-builder build --os ubuntu --os-version 24.04 \
            --hypervisor baremetal --release-channel "$CHANNEL"

      - name: Inspect image and write manifest
        run: |
          GZ=$(ls ubuntu-*-kube-*.gz | head -1)
          gzip -t "$GZ"
          SHA=$(sha256sum "$GZ" | awk '{print $1}')
          SIZE=$(stat -c %s "$GZ")
          python3 - "$GZ" "$SHA" "$SIZE" <<'PY'
          import json, sys
          json.dump({"file": sys.argv[1], "sha256": sys.argv[2], "bytes": int(sys.argv[3])},
                    open("os-manifest.json", "w"), indent=2)
          PY
          ls -lh "$GZ"
          cat os-manifest.json

      - name: Upload OS artifact
        uses: actions/upload-artifact@v7
        with:
          name: eksa-os-${{ env.BUNDLE }}-${{ env.CHANNEL }}
          path: |
            ubuntu-*-kube-*.gz
            os-manifest.json
          retention-days: 14