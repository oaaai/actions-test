name: inspect-image

on:
  push:
    branches: [ci/image-build]
    paths:
      - .github/workflows/inspect-image.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUN_ID: "44707730267"
      ARTIFACT: ubuntu-2404-kube-1-36

    steps:
      - name: Download artifact from the build run
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-utils parted mtools e2fsprogs file gzip util-linux

      - name: Inspect image
        run: |
          set +e
          set -uo pipefail
          exec > >(tee /tmp/report.txt) 2>&1

          GZ=$(find artifact -name '*.gz' -type f | head -1)
          echo "== artifact"
          ls -lh "$GZ"
          sha256sum "$GZ"
          gzip -t "$GZ" && echo "gzip: OK"
          gzip -l "$GZ"

          echo "== decompress"
          gunzip -c "$GZ" > /tmp/image.raw
          ls -lh /tmp/image.raw
          file /tmp/image.raw
          qemu-img info /tmp/image.raw

          echo "== partition table"
          fdisk -l /tmp/image.raw
          sfdisk -d /tmp/image.raw
          parted -s /tmp/image.raw unit s print

          echo "== extract partitions"
          python3 - <<'PY'
          import json, subprocess
          pt = json.loads(subprocess.check_output(["sfdisk", "-J", "/tmp/image.raw"]))["partitiontable"]
          print("label:", pt.get("label"), "id:", pt.get("id"))
          for p in pt["partitions"]:
              print("part", p["node"], "start", p["start"], "size", p["size"],
                    "type", p.get("type"), "name", p.get("name"))
          parts = pt["partitions"]
          esp = next((p for p in parts if "efi" in (p.get("name") or "").lower()
                      or (p.get("type") or "").lower() == "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"), None)
          root = next((p for p in parts if "root" in (p.get("name") or "").lower()
                       or (p.get("type") or "").lower() == "0fc63daf-8483-4772-8e79-3d69d8477de4"), None)
          if root is None:
              root = max(parts, key=lambda p: p["size"])
          if esp is None:
              esp = next((p for p in parts if p is not root), None)
          with open("/tmp/parts.env", "w") as f:
              f.write("ESP_START=%s\nESP_SIZE=%s\n" % (esp["start"], esp["size"]))
              f.write("ROOT_START=%s\nROOT_SIZE=%s\n" % (root["start"], root["size"]))
          print("ESP:", esp["start"], esp["size"], "ROOT:", root["start"], root["size"])
          PY
          . /tmp/parts.env
          dd if=/tmp/image.raw of=/tmp/esp.img bs=512 skip=$ESP_START count=$ESP_SIZE status=none
          dd if=/tmp/image.raw of=/tmp/root.img bs=512 skip=$ROOT_START count=$ROOT_SIZE status=none
          ls -lh /tmp/esp.img /tmp/root.img

          echo "== ESP"
          file /tmp/esp.img
          mdir -i /tmp/esp.img ::/
          mdir -i /tmp/esp.img ::/EFI/BOOT
          mdir -i /tmp/esp.img ::/EFI/ubuntu
          mcopy -i /tmp/esp.img ::/EFI/BOOT/BOOTX64.EFI /tmp/BOOTX64.EFI
          file /tmp/BOOTX64.EFI
          sha256sum /tmp/BOOTX64.EFI

          echo "== rootfs"
          file /tmp/root.img
          e2fsck -fn /tmp/root.img
          dumpe2fs -h /tmp/root.img 2>/dev/null | egrep 'Volume name|Filesystem UUID|Block count|Free blocks|Block size'
          debugfs -R 'cat /etc/os-release' /tmp/root.img 2>/dev/null
          debugfs -R 'cat /etc/hostname' /tmp/root.img 2>/dev/null
          debugfs -R 'ls -l /etc/kubernetes' /tmp/root.img 2>/dev/null
          debugfs -R 'ls -l /etc/kubernetes/kubelet' /tmp/root.img 2>/dev/null
          debugfs -R 'cat /etc/kubernetes/kubelet/kubelet-config.json' /tmp/root.img 2>/dev/null
          debugfs -R 'cat /etc/containerd/config.toml' /tmp/root.img 2>/dev/null
          debugfs -R 'ls -l /usr/lib/systemd/system' /tmp/root.img 2>/dev/null | egrep 'kubelet|containerd'
          debugfs -R 'ls -l /var/lib/containerd' /tmp/root.img 2>/dev/null

          echo "== binaries"
          for b in /usr/bin/kubelet /usr/bin/containerd /usr/local/bin/crictl /usr/bin/crictl /usr/bin/runc /usr/local/bin/runc; do
            if debugfs -R "stat $b" /tmp/root.img >/dev/null 2>&1; then
              out=/tmp/$(basename "$b")
              rm -f "$out"
              debugfs -R "dump $b $out" /tmp/root.img >/dev/null 2>&1
              chmod +x "$out" 2>/dev/null
              echo "-- $b"
              "$out" --version 2>&1 | head -3
            fi
          done

          echo "== strings"
          grep -abo -m1 'Ubuntu 24.04' /tmp/image.raw
          grep -abo -m1 'v1.36.5-eks' /tmp/image.raw
          grep -abo -m1 'containerd 1.' /tmp/image.raw

          echo "== raw sha256"
          sha256sum /tmp/image.raw
          df -h /

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-inspection
          path: /tmp/report.txt
          if-no-files-found: warn
